name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: ${{ github.workspace }}/app
      DB_ENGINE: django.db.backends.sqlite3
      COVERAGE_FAIL_UNDER: "70"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r app/requirements-ci.lock
          python -m pip install --require-hashes django-recaptcha==4.1.0 --hash=sha256:463aa65967e973de466b28ce8e8b6abb2faffb1ce0c7faa1bf0e5b041e0497cb

      - name: Run Django system check
        working-directory: app
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: app
        run: python manage.py makemigrations --check --dry-run

      - name: Run application tests with coverage
        run: >-
          python -m pytest app/cms/tests tests
          --ignore=tests/docs
          --cov=app
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=${COVERAGE_FAIL_UNDER}

      - name: Run documentation tests
        run: python -m pytest tests/docs
