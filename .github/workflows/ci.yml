name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: ${{ github.workspace }}/app
      DB_ENGINE: django.db.backends.sqlite3
      COVERAGE_FAIL_UNDER: "70"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest pytest-django pytest-cov

      - name: Run Django system check
        working-directory: app
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: app
        run: python manage.py makemigrations --check --dry-run

      - name: Run application tests with coverage
        run: >-
          python -m pytest app/cms/tests tests
          --ignore=tests/docs
          --cov=app
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=${COVERAGE_FAIL_UNDER}

      - name: Run documentation tests
        run: python -m pytest tests/docs
