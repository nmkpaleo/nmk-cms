name: Refresh dependency locks

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.14

      - name: Regenerate dependency locks
        run: |
          uv pip compile app/requirements-ci.in \
            --python-version 3.10 \
            --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes \
            --output-file app/requirements-ci.lock \
            --no-emit-index-url
          uv pip compile app/requirements-tooth-marking-cpu.txt \
            --python-version 3.10 \
            --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes \
            --output-file app/requirements-tooth-marking-cpu.lock \
            --emit-index-url \
            --index-strategy unsafe-best-match

      - name: Commit updated locks
        run: |
          git config user.name 'dependabot-locks[bot]'
          git config user.email 'dependabot-locks[bot]@users.noreply.github.com'
          git add app/requirements-ci.lock app/requirements-tooth-marking-cpu.lock
          if git diff --cached --quiet; then
            echo 'Dependency locks are already current.'
            exit 0
          fi
          git commit -m 'Regenerate dependency locks'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}