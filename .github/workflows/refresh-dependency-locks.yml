name: Refresh dependency locks

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.14

      - name: Fetch dependency inputs
        run: |
          git fetch --no-tags origin "$PR_BRANCH"
          rm -rf "$RUNNER_TEMP/dependency-inputs"
          mkdir -p "$RUNNER_TEMP/dependency-inputs"
          git archive FETCH_HEAD app/requirements.txt app/requirements-ci.in app/requirements-tooth-marking-cpu.txt | tar -x -C "$RUNNER_TEMP/dependency-inputs"

      - name: Regenerate dependency locks
        run: |
          uv pip compile "$RUNNER_TEMP/dependency-inputs/app/requirements-ci.in" \
            --python-version 3.10 \
            --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes \
            --output-file "$RUNNER_TEMP/requirements-ci.lock" \
            --no-emit-index-url
          uv pip compile "$RUNNER_TEMP/dependency-inputs/app/requirements-tooth-marking-cpu.txt" \
            --python-version 3.10 \
            --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes \
            --output-file "$RUNNER_TEMP/requirements-tooth-marking-cpu.lock" \
            --emit-index-url \
            --index-strategy unsafe-best-match

      - name: Commit updated locks
        run: |
          git fetch --no-tags origin "$PR_BRANCH"
          git checkout --detach FETCH_HEAD
          cp "$RUNNER_TEMP/requirements-ci.lock" app/requirements-ci.lock
          cp "$RUNNER_TEMP/requirements-tooth-marking-cpu.lock" app/requirements-tooth-marking-cpu.lock
          git config user.name 'dependabot-locks[bot]'
          git config user.email 'dependabot-locks[bot]@users.noreply.github.com'
          git add app/requirements-ci.lock app/requirements-tooth-marking-cpu.lock
          if git diff --cached --quiet; then
            echo 'Dependency locks are already current.'
            exit 0
          fi
          git commit -m 'Regenerate dependency locks'
          git push origin "HEAD:$PR_BRANCH"