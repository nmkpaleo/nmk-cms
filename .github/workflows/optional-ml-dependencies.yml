name: Optional ML dependencies

on:
  pull_request:
    paths:
      - app/requirements-tooth-marking-cpu.txt
      - .github/workflows/optional-ml-dependencies.yml
  push:
    branches:
      - main
    paths:
      - app/requirements-tooth-marking-cpu.txt
      - .github/workflows/optional-ml-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cpu-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install optional CPU stack
        run: python -m pip install -r app/requirements-tooth-marking-cpu.txt

