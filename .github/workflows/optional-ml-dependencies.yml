name: Optional ML dependencies

on:
  pull_request:
    paths:
      - app/requirements.txt
      - app/requirements-tooth-marking-cpu.txt
      - app/requirements-tooth-marking-cpu.lock
      - .github/workflows/optional-ml-dependencies.yml
  push:
    branches:
      - main
    paths:
      - app/requirements.txt
      - app/requirements-tooth-marking-cpu.txt
      - app/requirements-tooth-marking-cpu.lock
      - .github/workflows/optional-ml-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cpu-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install optional CPU stack
        run: python -m pip install --require-hashes -r app/requirements-tooth-marking-cpu.lock

      - name: Verify paired versions and imports
        run: |
          python - <<'PY'
          import torch
          import torchvision
          from torchvision.ops import nms

          assert torch.__version__.endswith('+cpu'), torch.__version__
          assert torchvision.__version__.endswith('+cpu'), torchvision.__version__
          assert torch.version.cuda is None
          boxes = torch.tensor([[0., 0., 2., 2.], [0., 0., 2., 2.]])
          scores = torch.tensor([0.9, 0.8])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(f'CPU inference verified: torch={torch.__version__}, torchvision={torchvision.__version__}')
          PY
