name: ci-staging

on:
  push:
    branches:
      - 'staging'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: ${{ github.workspace }}/app
      DB_ENGINE: django.db.backends.sqlite3
      COVERAGE_FAIL_UNDER: '70'
      COVERAGE_RATCHET_STEP: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest pytest-django pytest-cov

      - name: Run Django system check
        working-directory: app
        run: python manage.py check

      - name: Run migrations check
        working-directory: app
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage (module report + ratchet floor)
        run: |
          # Ratchet policy: increase COVERAGE_FAIL_UNDER by +${COVERAGE_RATCHET_STEP}% each sprint/release.
          python -m pytest app/cms/tests tests --ignore=tests/docs --cov=app --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=${COVERAGE_FAIL_UNDER}

      - name: Run docs tests (Markdown docs only, no MkDocs)
        run: python -m pytest tests/docs

  docker:
    runs-on: ubuntu-latest
    needs:
      - quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Validate source compiles (Django 5.2)
        run: python -m compileall app

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./app
          push: true
          tags: palaeontologyhelsinki/${{ secrets.DOCKERHUB_PROJECTNAME }}_staging:latest
