name: ci-staging

on:
  push:
    branches:
      - 'staging'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: ${{ github.workspace }}/app
      DB_ENGINE: django.db.backends.sqlite3
      COVERAGE_FAIL_UNDER: '70'
      COVERAGE_RATCHET_STEP: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --require-hashes -r app/requirements-ci.lock

      - name: Run Django system check
        working-directory: app
        run: python manage.py check

      - name: Run migrations check
        working-directory: app
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage (module report + ratchet floor)
        run: |
          # Ratchet policy: increase COVERAGE_FAIL_UNDER by +${COVERAGE_RATCHET_STEP}% each sprint/release.
          python -m pytest app/cms/tests tests --ignore=tests/docs --cov=app --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=${COVERAGE_FAIL_UNDER}

      - name: Run docs tests (Markdown docs only, no MkDocs)
        run: python -m pytest tests/docs

  docker:
    runs-on: ubuntu-latest
    environment: staging
    needs:
      - quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Validate source compiles (Django 5.2)
        run: python -m compileall app

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          push: true
          provenance: mode=max
          sbom: true
          tags: palaeontologyhelsinki/${{ secrets.DOCKERHUB_PROJECTNAME }}_staging:latest
