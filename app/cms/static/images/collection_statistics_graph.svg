<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Collection statistics graph background</title>
  <desc id="desc">A dark dashboard-style graph with bars, a line chart, and subtle catalogue data points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="0.48" stop-color="#602828"/>
      <stop offset="1" stop-color="#b85828"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="line" x1="140" y1="565" x2="1020" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a820"/>
      <stop offset="1" stop-color="#f0e0d8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="210" fill="#e8a820" opacity="0.18"/>
  <circle cx="132" cy="690" r="250" fill="#f0e0d8" opacity="0.10"/>

  <g opacity="0.18" stroke="#f0e0d8" stroke-width="1">
    <path d="M90 170H1110"/>
    <path d="M90 275H1110"/>
    <path d="M90 380H1110"/>
    <path d="M90 485H1110"/>
    <path d="M90 590H1110"/>
    <path d="M180 100V680"/>
    <path d="M330 100V680"/>
    <path d="M480 100V680"/>
    <path d="M630 100V680"/>
    <path d="M780 100V680"/>
    <path d="M930 100V680"/>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="104" y="112" width="992" height="568" rx="28" fill="url(#panel)" stroke="#f0e0d8" stroke-opacity="0.24"/>
    <rect x="144" y="156" width="230" height="74" rx="16" fill="#f0e0d8" opacity="0.16"/>
    <rect x="410" y="156" width="230" height="74" rx="16" fill="#e8a820" opacity="0.14"/>
    <rect x="676" y="156" width="230" height="74" rx="16" fill="#f0e0d8" opacity="0.12"/>
  </g>

  <g opacity="0.92">
    <rect x="180" y="500" width="58" height="104" rx="10" fill="#b85828"/>
    <rect x="285" y="442" width="58" height="162" rx="10" fill="#e8a820"/>
    <rect x="390" y="378" width="58" height="226" rx="10" fill="#f0e0d8"/>
    <rect x="495" y="420" width="58" height="184" rx="10" fill="#b85828"/>
    <rect x="600" y="322" width="58" height="282" rx="10" fill="#e8a820"/>
    <rect x="705" y="286" width="58" height="318" rx="10" fill="#f0e0d8"/>
    <rect x="810" y="240" width="58" height="364" rx="10" fill="#b85828"/>
    <rect x="915" y="194" width="58" height="410" rx="10" fill="#e8a820"/>
  </g>

  <path d="M180 542 C275 462 330 488 405 414 C495 326 560 380 640 300 C730 210 820 282 925 178"
        fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round" opacity="0.96"/>

  <g fill="#f0e0d8" stroke="#e8a820" stroke-width="7">
    <circle cx="180" cy="542" r="12"/>
    <circle cx="405" cy="414" r="12"/>
    <circle cx="640" cy="300" r="12"/>
    <circle cx="925" cy="178" r="12"/>
  </g>

  <g opacity="0.45" fill="#f0e0d8">
    <rect x="150" y="705" width="150" height="12" rx="6"/>
    <rect x="332" y="705" width="95" height="12" rx="6"/>
    <rect x="460" y="705" width="170" height="12" rx="6"/>
    <rect x="662" y="705" width="120" height="12" rx="6"/>
    <rect x="814" y="705" width="210" height="12" rx="6"/>
  </g>
</svg>
