{% extends "admin/change_list.html" %}
{% load i18n %}
{% block object-tools-items %}
  {% if merge_duplicates_url %}
    <li>
      <form method="post" action="{{ merge_duplicates_url }}"
            onsubmit="return confirm('{% trans "Merge all accession references that share the same accession and reference?" %}');">
        {% csrf_token %}
        <button type="submit" class="button">{% trans "Merge duplicate references" %}</button>
      </form>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
